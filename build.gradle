plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"cubism" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Compiled against only. The mod works without them, and their mixins apply only when they are loaded.
	clientCompileOnly "maven.modrinth:sodium:${project.sodium_version}"
	clientCompileOnly "maven.modrinth:iris:${project.iris_version}"
	clientCompileOnly "maven.modrinth:voxy:${project.voxy_version}"
	clientCompileOnly "maven.modrinth:entityculling:${project.entityculling_version}"
	clientCompileOnly "maven.modrinth:xaeros-minimap:${project.xaerominimap_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Set cubism.deployDir in ~/.gradle/gradle.properties to copy each build into the mods folder of a test instance.
def deployDir = providers.gradleProperty('cubism.deployDir')
if (deployDir.isPresent()) {
	tasks.register('deployToInstance', Copy) {
		dependsOn tasks.named('jar')
		from(tasks.named('jar').flatMap { it.archiveFile })
		into(deployDir.get())
	}

	tasks.named('build') {
		finalizedBy('deployToInstance')
	}
}
